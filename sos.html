<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Emergency SOS</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">

<h1>🚨 Emergency SOS</h1>


<h3 id="sosStatus">
🔴 SOS Activated
</h3>


<p>
👤 Emergency Contact:
<span id="contactStatus">
Ready
</span>
</p>


<p>
📞 Add Emergency Contact:
</p>

<input 
type="text" 
id="emergencyContact"
placeholder="Enter phone number"
>


<p>
⏰ SOS Time:
<span id="sosTime">
Not Activated
</span>
</p>



<p>
📍 Live Location:
</p>

<div id="locationBox">
Waiting for location...
</div>



<div id="messageBox">

📩 Emergency Message Preview:
<br><br>
No message sent yet.

</div>



<button id="safeBtn" style="background:green;">
✅ I'm Safe
</button>


</div>

<a href="index.html">🏠 Home</a>

<a href="monitor.html">🤖 Monitor</a>

<a href="sos.html">🚨 SOS</a>

<a href="settings.html">⚙️ Settings</a>

</nav>



<script src="script.js"></script>


</body>

</html>
