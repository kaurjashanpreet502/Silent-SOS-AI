<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Silent SOS AI</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<h1>🚨 Silent SOS AI</h1>

<p>Your Emergency Safety Assistant</p>

<h3 id="status">🟢 Status: Safe</h3>

<button id="activateBtn">
🛡️ Activate Protection
</button>

<p>🔋 Battery: <span id="battery">85%</span></p>

<p>🏃 Sudden Running Detection:
<span id="running" style="color:green;">Normal</span>
</p>

<p>⚠️ Risk Level:
<span id="risk" style="color:green;">LOW</span>
</p>

<p>🧍 Movement Status:
<span id="movement" style="color:green;">Monitoring...</span>
</p>
  
<div id="result"></div>

</div>

<script src="script.js"></script>

</body>
</html>
